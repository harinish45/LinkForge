# EntityLink AI Configuration
project_name: "EntityLink AI"
seed: 42

paths:
  data_dir: "data"
  train_dir: "data/train"
  test_dir: "data/test"
  output_dir: "output"
  model_dir: "models"
  logs_dir: "logs"

blocking:
  max_candidates_per_entity: 50
  strategies:
    - "country_exact"
    - "name_first_token"
    - "address_token_overlap"

features:
  name:
    exact_match: true
    token_jaccard: true
    levenshtein_ratio: true
    char_ngram_cosine: true
    length_ratio: true
    shared_token_count: true
  address:
    exact_match: true
    token_jaccard: true
    char_ratio: true
    postal_code_match: true
    shared_numbers: true
  cross_field:
    country_match: true
    combined_similarity: true

model:
  type: "gradient_boosting" # Options: rule_based, logistic_regression, gradient_boosting
  max_depth: 6
  n_estimators: 150
  learning_rate: 0.1
  subsample: 0.8
  random_state: 42

matching:
  decision_rule: "threshold_with_gap" # Options: single_threshold, threshold_with_gap
  primary_threshold: 0.65
  confidence_gap: 0.15
  max_matches_per_s1: 10
  allow_empty: true
